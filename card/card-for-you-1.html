<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Message For You</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #1a1a1d;
            background-image: radial-gradient(circle at 50% 50%, #2a2a30 0%, #111113 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Lato', sans-serif;
            overflow: hidden;
            perspective: 1500px;
        }

        /* --- THE 3D SCENE --- */
        .scene {
            position: relative;
            width: 340px;
            height: 240px;
            transform-style: preserve-3d;
            margin-bottom: 40px;
        }

        /* --- ENVELOPE BACK --- */
        .envelope-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #e8e2d5;
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* --- THE CARD (Inside Envelope) --- */
        .card {
            position: absolute;
            top: 10px;
            left: 10px;
            width: calc(100% - 20px);
            height: calc(100% - 20px);
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
            cursor: pointer;
        }

        .card.slide-up {
            transform: translateY(-140px);
        }

        .card-front {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a3c34 0%, #0f2620 100%);
            border-radius: 4px;
            backface-visibility: hidden;
            transform-origin: left center;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #d4af37;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            z-index: 3;
        }

        .card-front.flip-open {
            transform: rotateY(-165deg);
        }

        .card-front h2 {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 24px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .card-front p {
            color: #a8b5b0;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .card-inside {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #fdfbf7;
            border-radius: 4px;
            backface-visibility: hidden;
            transform: rotateY(180deg);
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .card-inside img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .card-inside-content {
            padding: 15px;
            text-align: center;
        }

        .card-inside-content h3 {
            font-family: 'Cinzel', serif;
            color: #1a3c34;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .card-inside-content p {
            color: #555;
            font-size: 12px;
            line-height: 1.5;
        }

        /* --- ENVELOPE POCKET (Front) --- */
        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f4f1ea;
            border-radius: 4px;
            z-index: 4;
            /* Creates the V-shape pocket */
            clip-path: polygon(0 0, 50% 45%, 100% 0, 100% 100%, 0 100%);
            box-shadow: inset 0 15px 30px rgba(0,0,0,0.15);
        }

        /* --- ENVELOPE FLAP --- */
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ebe6d9;
            border-radius: 4px;
            z-index: 5;
            transform-origin: top;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            /* Creates the inverted V-shape flap */
            clip-path: polygon(0 0, 100% 0, 100% 45%, 50% 100%, 0 45%);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .envelope-flap.open {
            transform: rotateX(180deg);
            z-index: 1; /* Moves behind the card when open */
        }

        /* --- WAX SEAL --- */
        .wax-seal {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 55px;
            height: 55px;
            background: radial-gradient(circle at 30% 30%, #a82323, #6b0f0f);
            border-radius: 50%;
            z-index: 6;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 
                0 4px 10px rgba(0,0,0,0.4),
                inset 0 -3px 8px rgba(0,0,0,0.3),
                inset 0 3px 8px rgba(255,255,255,0.2);
            border: 2px solid #d4af37;
            transition: all 0.5s ease;
            animation: pulse 2s infinite;
        }

        .wax-seal::before {
            content: 'Nj';
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .wax-seal:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }

        .wax-seal.hidden {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
        }

        @keyframes pulse {
            0% { box-shadow: 0 4px 10px rgba(0,0,0,0.4), 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { box-shadow: 0 4px 10px rgba(0,0,0,0.4), 0 0 0 15px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 4px 10px rgba(0,0,0,0.4), 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        /* --- INSTRUCTIONS --- */
        .instruction {
            color: #888;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: opacity 0.5s ease;
            text-align: center;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 400px) {
            .scene {
                transform: scale(0.85);
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="envelope-back"></div>
        
        <!-- The Card Inside -->
        <div class="card" id="card">
            <div class="card-front" id="cardFront">
                <h2>Happy Birthday</h2>
                <p>Tap to open</p>
            </div>
            <div class="card-inside">
                <!-- CHANGE THIS IMAGE: Replace the URL below with your own image -->
                <img src="https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?auto=format&fit=crop&q=80&w=600" alt="Birthday">
                <div class="card-inside-content">
                    <!-- CHANGE THIS TEXT -->
                    <h3>Dear Sarah</h3>
                    <p>Wishing you a day filled with love, laughter, and all the joy your heart can hold. May this year bring you endless blessings.</p>
                </div>
            </div>
        </div>

        <!-- Envelope Front Pocket -->
        <div class="envelope-pocket"></div>
        
        <!-- Envelope Flap -->
        <div class="envelope-flap" id="flap"></div>
        
        <!-- Wax Seal -->
        <div class="wax-seal" id="seal"></div>
    </div>

    <div class="instruction" id="instruction">Tap the seal to open</div>

    <script>
        const seal = document.getElementById('seal');
        const flap = document.getElementById('flap');
        const card = document.getElementById('card');
        const cardFront = document.getElementById('cardFront');
        const instruction = document.getElementById('instruction');

        let step = 1;

        // Step 1: Click Seal -> Open Flap
        seal.addEventListener('click', () => {
            if (step === 1) {
                seal.classList.add('hidden');
                flap.classList.add('open');
                instruction.innerText = 'Tap the card to read';
                step = 2;
                
                // Slide card up after flap opens
                setTimeout(() => {
                    card.classList.add('slide-up');
                }, 600);
            }
        });

        // Step 2: Click Card -> Flip Open
        card.addEventListener('click', () => {
            if (step === 2) {
                cardFront.classList.add('flip-open');
                instruction.style.opacity = '0';
                step = 3;
            }
        });
    </script>
</body>
</html>
