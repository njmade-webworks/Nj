<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Birthday Message</title>
    
    <!-- Import GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- Import Elegant Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #fdfbf7 0%, #f4ece4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1500px; /* Gives depth to the 3D animations */
        }

        /* --- TYPOGRAPHY --- */
        .header-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 36px;
            color: #4a3b32;
            margin-bottom: 50px;
            opacity: 0;
            letter-spacing: 1px;
        }

        .instruction {
            margin-top: 60px;
            font-size: 13px;
            color: #8c7b70;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
        }

        /* --- 3D SCENE --- */
        .scene {
            position: relative;
            width: 340px;
            height: 240px;
            transform-style: preserve-3d;
        }

        /* 1. Envelope Back */
        .env-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #5c1a1b; /* Deep Burgundy */
            border-radius: 6px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }

        /* 2. The Card (Sits inside) */
        .card {
            position: absolute;
            top: 10px;
            left: 10px;
            width: calc(100% - 20px);
            height: calc(100% - 20px);
            transform-style: preserve-3d;
            z-index: 2;
            cursor: pointer;
        }

        /* Card Cover (Front) */
        .card-cover {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%); /* Rich Gold */
            border-radius: 4px;
            backface-visibility: hidden;
            transform-origin: left center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 1px solid #f4ece4;
            z-index: 3;
        }

        .card-cover h2 {
            font-family: 'Cormorant Garamond', serif;
            color: #fdfbf7;
            font-size: 26px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .card-cover p {
            color: #fdfbf7;
            font-size: 11px;
            letter-spacing: 3px;
            margin-top: 10px;
            opacity: 0.8;
        }

        /* Card Inside (Back of the cover) */
        .card-inside {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #fdfbf7;
            border-radius: 4px;
            backface-visibility: hidden;
            transform: rotateY(180deg);
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }

        .card-inside img {
            width: 100%;
            height: 110px;
            object-fit: cover;
        }

        .card-inside-text {
            padding: 15px;
            text-align: center;
        }

        .card-inside-text h3 {
            font-family: 'Cormorant Garamond', serif;
            color: #5c1a1b;
            font-size: 20px;
            margin-bottom: 5px;
        }

        .card-inside-text p {
            color: #666;
            font-size: 11px;
            line-height: 1.4;
        }

        /* 3. Envelope Pocket (Front Bottom) */
        .env-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #8a1c1c; /* Slightly lighter burgundy */
            border-radius: 6px;
            z-index: 4;
            clip-path: polygon(0 0, 50% 45%, 100% 0, 100% 100%, 0 100%);
            box-shadow: inset 0 15px 30px rgba(0,0,0,0.2);
        }

        /* 4. Envelope Flap (Top) */
        .env-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #7a1819; /* Darker burgundy for depth */
            border-radius: 6px;
            z-index: 5;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 50% 100%, 0 45%);
            transform-origin: top;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* 5. Glossy Wax Seal (No Text) */
        .wax-seal {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 35% 35%, #f9e596, #d4af37, #996515);
            border-radius: 50%;
            z-index: 6;
            cursor: pointer;
            box-shadow: 
                0 6px 12px rgba(0,0,0,0.3),
                inset 0 -4px 8px rgba(0,0,0,0.2),
                inset 0 4px 8px rgba(255,255,255,0.5);
            border: 2px solid #fdfbf7;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 450px) {
            .scene { transform: scale(0.85); }
            .header-text { font-size: 28px; margin-bottom: 30px; }
            .instruction { margin-top: 40px; }
        }
    </style>
</head>
<body>

    <h1 class="header-text">A Special Message For You</h1>

    <div class="scene">
        <div class="env-back"></div>
        
        <!-- The Card -->
        <div class="card" id="card">
            <div class="card-cover" id="cardCover">
                <h2>Happy Birthday</h2>
                <p>Tap to open</p>
            </div>
            <div class="card-inside">
                <!-- CHANGE THIS IMAGE: Put your client's photo URL here -->
                <img src="https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?auto=format&fit=crop&q=80&w=600" alt="Birthday">
                <div class="card-inside-text">
                    <!-- CHANGE THIS TEXT -->
                    <h3>Dear Sarah</h3>
                    <p>Wishing you a day filled with love, laughter, and endless joy. May this year be your best one yet.</p>
                </div>
            </div>
        </div>

        <div class="env-pocket"></div>
        <div class="env-flap" id="flap"></div>
        <div class="wax-seal" id="seal"></div>
    </div>

    <p class="instruction" id="instruction">Tap the wax seal</p>

    <script>
        // Wait for fonts to load before animating text
        document.fonts.ready.then(() => {
            gsap.to(".header-text", { opacity: 1, duration: 1.5, ease: "power2.out" });
            gsap.to(".instruction", { opacity: 1, duration: 1.5, delay: 0.5, ease: "power2.out" });
        });

        let step = 1;

        // Step 1: Click Wax Seal
        document.getElementById('seal').addEventListener('click', () => {
            if (step !== 1) return;
            step = 2;

            const tl = gsap.timeline();

            // 1. Shrink and fade the seal
            tl.to("#seal", { scale: 0, opacity: 0, duration: 0.4, ease: "back.in(1.7)" })
            
            // 2. Open the flap smoothly
              .to("#flap", { rotationX: 180, duration: 0.8, ease: "power2.inOut" }, "-=0.2")
            
            // 3. Slide the card up with a slight bounce
              .to("#card", { y: -130, duration: 1, ease: "back.out(1.4)" }, "-=0.4")
            
            // 4. Update instruction text
              .call(() => {
                  document.getElementById('instruction').innerText = "Tap the card to read";
              });
        });

        // Step 2: Click Card to Flip Open
        document.getElementById('card').addEventListener('click', () => {
            if (step !== 2) return;
            step = 3;

            const tl = gsap.timeline();

            // Flip the cover open like a book
            tl.to("#cardCover", { rotationY: -180, duration: 1.2, ease: "power2.inOut" })
            
            // Fade out instruction
              .to("#instruction", { opacity: 0, duration: 0.5 }, "-=1");
        });
    </script>
</body>
</html>
