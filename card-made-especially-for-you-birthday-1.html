<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: cardEntry 1s ease-out;
        }

        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .emoji {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            color: #1e293b;
            margin-bottom: 10px;
            animation: fadeIn 1.5s ease-out 0.3s both;
        }

        .name {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-style: italic;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            animation: fadeIn 1.5s ease-out 0.6s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            font-size: 18px;
            color: #64748b;
            line-height: 1.8;
            margin-bottom: 40px;
            animation: fadeIn 1.5s ease-out 0.9s both;
        }

        .details {
            background: #f8fafc;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            animation: fadeIn 1.5s ease-out 1.2s both;
        }

        .detail-item {
            margin-bottom: 20px;
        }

        .detail-item:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 20px;
            color: #1e293b;
            font-weight: 500;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f43f5e;
            animation: fall 3s linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .confetti:nth-child(1) { left: 10%; animation-delay: 0s; background: #667eea; }
        .confetti:nth-child(2) { left: 20%; animation-delay: 0.5s; background: #f43f5e; }
        .confetti:nth-child(3) { left: 30%; animation-delay: 1s; background: #764ba2; }
        .confetti:nth-child(4) { left: 40%; animation-delay: 1.5s; background: #fbbf24; }
        .confetti:nth-child(5) { left: 50%; animation-delay: 2s; background: #10b981; }
        .confetti:nth-child(6) { left: 60%; animation-delay: 0.3s; background: #667eea; }
        .confetti:nth-child(7) { left: 70%; animation-delay: 0.8s; background: #f43f5e; }
        .confetti:nth-child(8) { left: 80%; animation-delay: 1.3s; background: #764ba2; }
        .confetti:nth-child(9) { left: 90%; animation-delay: 1.8s; background: #fbbf24; }

        .footer {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 30px;
            animation: fadeIn 1.5s ease-out 1.5s both;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .card {
                padding: 40px 30px;
            }
            h1 {
                font-size: 36px;
            }
            .name {
                font-size: 28px;
            }
            .emoji {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <!-- Confetti Animation -->
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>

    <div class="card">
        <div class="emoji">🎂</div>
        <h1>Happy Birthday</h1>
        <!-- CHANGE THIS: Client's Name -->
        <div class="name">Sarah</div>
        
        <p class="message">
            Wishing you a day filled with love, laughter, and all the joy your heart can hold. 
            May this year bring you endless blessings and beautiful memories.
        </p>

        <div class="details">
            <!-- CHANGE THIS: Event Details -->
            <div class="detail-item">
                <div class="detail-label">Date</div>
                <div class="detail-value">Saturday, October 24, 2024</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Time</div>
                <div class="detail-value">7:00 PM</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Location</div>
                <div class="detail-value">The Garden Restaurant</div>
            </div>
        </div>

        <div class="footer">
            Made with love by <a href="https://instagram.com/njmade_official" target="_blank">Nj Made</a>
        </div>
    </div>
</body>
</html>
